name: Publish CAP v0.3 GitHub release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download canonical Zenodo artefacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://zenodo.org/records/23138399/files/CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip?download=1" -o CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip
          curl -fL "https://zenodo.org/records/23138399/files/CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip?download=1" -o CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip

      - name: Verify canonical SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "516445b31f9dd40e120a5695a022d769b32dadefa7e5f474780fb7162cf73280  CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip" | sha256sum -c -
          echo "5a1697e72ef43319632ffab4b911c948cac05e52f41845ec6e2d2c285dc40897  CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip" | sha256sum -c -

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3 >/dev/null 2>&1; then
            gh release upload v0.3               CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip               CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip               --clobber
          else
            gh release create v0.3               CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip               CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip               --target main               --title "CAP v0.3 — Canal Activation Protocol"               --notes "Public release of CAP v0.3. Canonical publication consists of two sibling artefacts: the CAP ZIP and its canonical PTC package generated from that exact ZIP. Zenodo DOI: https://doi.org/10.5281/zenodo.23138399"
          fi

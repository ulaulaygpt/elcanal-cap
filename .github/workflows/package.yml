name: Verify CAP v0.3 canonical artefacts

on:
  push:
    branches: [main]
    paths:
      - 'CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip'
      - 'CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip.sha256'
      - 'CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip'
      - 'CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip.sha256'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical artefact hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c CAP_v0.3_2026-10-04_PUBLICO_FINAL.zip.sha256
          sha256sum -c CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip.sha256

name: Reconstruct canonical PTC artefact

on:
  push:
    branches: [main]
    paths:
      - '.ptc-build/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify PTC ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .ptc-build/part-* > /tmp/ptc.b64
          base64 -d /tmp/ptc.b64 > CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip
          echo "5a1697e72ef43319632ffab4b911c948cac05e52f41845ec6e2d2c285dc40897  CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip" > CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip.sha256
          sha256sum -c CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip.sha256

      - name: Commit canonical PTC and remove build chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .ptc-build
          git add -A .ptc-build CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip CAP_v0.3_2026-10-04_PUBLICO_FINAL_ptc_frs01.zip.sha256
          git commit -m "Reconstruct verified canonical PTC artefact"
          git push
